  <g stroke="#FFB81C" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="20" x2="100" y2="5"/>
    <line x1="100" y1="155" x2="100" y2="170"/>
    <line x1="30" y1="80" x2="15" y2="80"/>
    <line x1="185" y1="80" x2="170" y2="80"/>
    <line x1="45" y1="35" x2="35" y2="25"/>
    <line x1="165" y1="155" x2="175" y2="165"/>
    <line x1="155" y1="35" x2="165" y2="25"/>
    <line x1="35" y1="155" x2="25" y2="165"/>
  </g>
</svg>