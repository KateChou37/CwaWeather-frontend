  <path d="M 40 75 Q 30 60 50 50 Q 60 40 75 45 Q 85 30 100 40 Q 115 30 130 45 Q 150 50 145 70 Q 155 75 150 90 Q 135 100 115 95 Q 95 105 75 100 Q 55 105 40 90 Q 30 85 40 75 Z" fill="url(#stormGrad)" stroke="#000" stroke-width="1.5"/>
