<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="100%" stop-color="#FFF4E0"/>
    </linearGradient>

    <linearGradient id="skirtGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFEE86"/>
      <stop offset="100%" stop-color="#F8D145"/>
    </linearGradient>

    <linearGradient id="topGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#2AAFA4"/>
      <stop offset="100%" stop-color="#168B86"/>
    </linearGradient>

    <filter id="paperTex">
      <feTurbulence baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0.02"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- 紙張質感疊加 (透明) -->
  <rect width="100%" height="100%" fill="#fff" opacity="0.06" filter="url(#paperTex)" />

  <!-- 花朵群（復古植物畫風，偏橘白） -->
  <g transform="translate(140,160) scale(1.05)">
    <!-- 大花 1 -->
    <g opacity="0.95">
      <path d="M620 180 C660 120, 760 120, 800 180 C840 240, 820 320, 760 340 C700 360, 640 320, 620 260 C600 200, 580 200, 620 180 Z" fill="#F7A35C" stroke="#D67A34" stroke-width="2" opacity="0.95" />
      <circle cx="740" cy="250" r="16" fill="#FFF7E6" />
    </g>

    <!-- 小花群 -->
    <g transform="translate(80,220)" opacity="0.9">
      <path d="M120 60 C140 20, 180 20, 200 60 C220 100, 200 140, 160 150 C120 160, 80 140, 120 60 Z" fill="#FFF8F0" stroke="#E7B48B" stroke-width="1.6"/>
      <path d="M40 140 C80 110, 140 110, 180 140" stroke="#E69B5E" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 更多小花，營造環繞感 -->
    <g opacity="0.9">
      <path d="M200 20 C170 40, 150 80, 160 110" stroke="#D87A3A" stroke-width="2" fill="none"/>
      <path d="M520 420 C540 380, 620 360, 680 380" stroke="#E6A66E" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- 主體：年輕女孩側面（簡化、書籍封面風） -->
  <g transform="translate(260,380)">
    <!-- 裙子（大量、澎） -->
    <g filter="url(#softShadow)">
      <path d="M300 700 C140 720, 120 360, 300 320 C480 280, 560 300, 700 320 C820 340, 760 720, 600 700 C480 690, 400 710, 300 700 Z" fill="url(#skirtGrad)" stroke="#D9B24A" stroke-width="2" opacity="0.98"/>
      <!-- 花紋（淡淡的手繪） -->
      <g fill="#F2C86B" opacity="0.55">
        <ellipse cx="380" cy="500" rx="18" ry="26" transform="rotate(-12 380 500)"/>
        <ellipse cx="520" cy="420" rx="12" ry="18" transform="rotate(10 520 420)"/>
        <ellipse cx="640" cy="520" rx="14" ry="20" transform="rotate(-8 640 520)"/>
      </g>
    </g>

    <!-- 上衣 -->
    <g>
      <path d="M240 320 C260 220, 420 200, 520 270 C540 290, 520 340, 480 340 C420 340, 380 320, 240 320 Z" fill="url(#topGrad)" stroke="#11766C" stroke-width="2"/>
    </g>

    <!-- 頭 / 髮型（側面） -->
    <g transform="translate(360,140)">
      <ellipse cx="0" cy="0" rx="48" ry="62" fill="#FFEFD6" stroke="#E8CDB2" stroke-width="1.6" />
      <!-- 髮型，簡潔的低髮髻 -->
      <path d="M-28 -6 C-80 0, -90 80, -10 100 C20 110, 40 86, 38 56 C36 34, 22 10, -8 -6 Z" fill="#2B1B18" opacity="0.95" />
      <path d="M-8 80 C-2 86, 6 92, 18 90" stroke="#1b0f0d" stroke-width="2" fill="none"/>

      <!-- 臉部簡單輪廓與鼻子 -->
      <circle cx="8" cy="0" r="2.2" fill="#663A2E" />
      <path d="M12 8 C10 10, 14 12, 18 12" stroke="#6B3F30" stroke-width="1.2" fill="none" />
    </g>

    <!-- 手與包包 -->
    <g transform="translate(500,340)">
      <!-- 手臂 -->
      <path d="M-40 40 C-20 60, 0 80, 22 92" stroke="#FFDAB8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- 包包 -->
      <g transform="translate(32,88)">
        <rect x="-8" y="-8" width="92" height="66" rx="10" fill="#FFD95A" stroke="#D6A83A" stroke-width="2"/>
        <path d="M12 -8 C28 10, 60 8, 76 -8" stroke="#D6A83A" stroke-width="2" fill="none"/>
        <rect x="10" y="18" width="60" height="6" rx="3" fill="#E6C05A"/>
      </g>
    </g>

    <!-- 領口和腰帶小細節 -->
    <g>
      <path d="M300 320 C380 320, 420 340, 500 356" stroke="#BEEEDC" stroke-width="3" fill="none" opacity="0.9"/>
    </g>
  </g>

  <!-- 底部簽名與小裝飾 -->
  <g transform="translate(920,1480)" opacity="0.6">
    <text x="0" y="0" font-family="serif" font-size="18" fill="#B6894B">水彩風 • 書封示範</text>
  </g>
</svg>